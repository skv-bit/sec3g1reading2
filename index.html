[{id:'accident',x:-3,z:-1.7,label:'脚踏车事件',next:'bandage'},{id:'bandage',x:2.1,z:-3.0,label:'第二天的纱布',next:'exit'},{id:'exit',x:4.4,z:-.6,label:'进入下一幕'}],
[{id:'bell',x:1.7,z:-3,label:'门铃：为什么犹豫',next:'watch'},{id:'watch',x:-3.5,z:-.9,label:'手表：珍惜友谊',next:'door'},{id:'door',x:0,z:-4.4,label:'丽华的真实回应',next:'evidence'},{id:'evidence',x:-3.0,z:1.5,label:'证据整合站',next:'classExit'},{id:'classExit',x:4.6,z:-1.5,label:'线下讨论站'}],
[{id:'display',x:-3.3,z:-2,label:'展示板',next:'repair'},{id:'repair',x:2.5,z:-1.6,label:'修补处',next:'finish'},{id:'finish',x:.4,z:-4.2,label:'独立挑战'}]];
const SAVE='watch_reading_walk_v5_original_only';let saved={};try{saved=JSON.parse(localStorage.getItem(SAVE)||'{}')}catch(e){}
const state={scene:0,player:{x:-4.4,z:4.1},done:{},homeAnswer:'',homeDraft:'',homeReflect:'',bridgeAnswer:'',badge:false,highest:0,helpOpen:false,muted:true,activeModal:true,...saved};
state.done=state.done||{};state.player=state.player||{x:-4.4,z:4.1};const keydown=new Set(), touchDirections=new Set();let W=1,H=1,dpr=1,lastT=performance.now(),clock=0,currentMarkers=[],toastTimer=null,shownScene=-1,ambient=null;
const starts=[{x:-4.4,z:4.1},{x:-4.4,z:4.1},{x:-4.1,z:4.1}];
function persist(){try{localStorage.setItem(SAVE,JSON.stringify({scene:state.scene,player:state.player,done:state.done,homeAnswer:state.homeAnswer,homeDraft:state.homeDraft,homeReflect:state.homeReflect,bridgeAnswer:state.bridgeAnswer,badge:state.badge,highest:state.highest}))}catch(e){}}
function isDone(id){return !!state.done[id]}
function mark(id){state.done[id]=true;persist();renderUI();}
function stageItems(){return ITEMS[state.scene]}
function isLocked(id){if(state.scene===0)return id==='bandage'&&!isDone('accident')||id==='exit'&&!isDone('bandage');if(state.scene===1)return id==='watch'&&!isDone('bell')||id==='door'&&!isDone('watch')||id==='evidence'&&!isDone('door')||id==='classExit'&&!isDone('evidence');return id==='repair'&&!isDone('display')||id==='finish'&&!isDone('repair');}
function nextTarget(){return stageItems().find(x=>!isDone(x.id))||stageItems().at(-1)}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){overlay.classList.remove('hidden');state.activeModal=true;modal.innerHTML=html;const focus=modal.querySelector('button');if(focus)focus.focus();}
function close(){overlay.classList.add('hidden');state.activeModal=false;modal.innerHTML='';}
function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
function renderUI(){const st=STAGE[state.scene];$('chapterLabel').textContent=st.name;$('objectiveTitle').textContent=st.title;$('objectiveSub').textContent=st.sub;let target=nextTarget();$('statusTitle').textContent=target&&isDone(target.id)?'🏅 本幕已完成':'✨ 下一个线索：'+(target?.label||'任务');$('statusInfo').textContent='用方向键 / WASD 移动 · 靠近后按 E 或点击任务标记';const items=stageItems();document.querySelectorAll('#keys .key').forEach((el,i)=>el.classList.toggle('on',i<items.filter(it=>isDone(it.id)).length));}
function sceneStart(scene){state.scene=scene;state.highest=Math.max(state.highest,scene);state.player={...starts[scene]};state.insideHotspotId=null;state.autowalk=null;persist();renderUI();renderMarkers();$('scene-fade').classList.add('on');setTimeout(()=>$('scene-fade').classList.remove('on'),360);toast(['📖 第一幕：友谊的回忆','🚪 第二幕：丽华家门口','📚 第三幕：新故事挑战'][scene]);}
function optionsHTML(opts,multi=false){return '<div class="choices" id="answers">'+opts.map((o,i)=>`<button type="button" class="choice" data-choice="${i}"><span class="mark">${multi?'□':String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')+'</div>'}
function choicesSetup(correct,ok, wrongText,multi=false){let selected=new Set();document.querySelectorAll('#answers .choice').forEach(b=>b.addEventListener('click',()=>{let i=Number(b.dataset.choice);if(!multi)selected.clear();if(multi&&selected.has(i))selected.delete(i);else selected.add(i);document.querySelectorAll('#answers .choice').forEach(c=>{let on=selected.has(Number(c.dataset.choice));c.classList.toggle('selected',on);c.querySelector('.mark').textContent=multi?(on?'☑':'□'):String.fromCharCode(65+Number(c.dataset.choice))})}));$('checkBtn').addEventListener('click',()=>{let pass=selected.size===correct.length&&correct.every(x=>selected.has(x));if(pass){$('feedback').className='feedback ok';$('feedback').innerHTML='✓ 阅读证据正确！关卡已解锁。';$('checkBtn').disabled=true;mark(ok.id);const done=$('continueBtn');if(done){done.style.display='inline-block';done.addEventListener('click',()=>{close();if(ok.after)ok.after()})}toast('✨ 线索解锁！');}else{$('feedback').className='feedback';$('feedback').textContent=wrongText;toast('再找一找原文线索');}});}
function quizModal({label,heading,quote,options,correct,multi=false,hint,why,id,onSuccess}){
show(`<div class="eyebrow">✧ 闯关任务 · ${esc(label)}</div><h2>${esc(heading)}</h2>${quote?`<div class="quote">${esc(quote)}</div>`:''}${optionsHTML(options,multi)}<details class="support"><summary>🧩 需要提示？点击查看</summary><p>${esc(hint)}</p></details><div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回场景</button><button class="primary" id="checkBtn">核对我的选择</button><button class="primary" id="continueBtn" style="display:none">继续探索 →</button></div>`);
$('backBtn').onclick=close;choicesSetup(correct,{id,after:()=>{if(onSuccess)onSuccess()}},why,multi)
}
function teacherMemory1(){show(`<div class="eyebrow">I DO · 教师示范 1/2</div><h2>第一处证据：危险时刻</h2><p>场景提示：丽华看见脚踏车冲向“我”，连忙把“我”推开。<strong>丽华自己摔倒受伤，“我”没有受伤。</strong></p><div class="quote">第3段：“丽华连忙推开我，结果自己却摔倒在地上。她擦伤了手臂，我反而没事。”</div><p><strong>教师 Think-Aloud：</strong>“我先想到：丽华可能很关心别人。不过，我要检查自己的判断，还有没有另一处言行可以支持？”</p><div class="note">请学生留意：老师没有只说“她很好”，而是先找动作证据，再继续验证。</div><div class="modal-actions"><button class="secondary" id="closeBtn">返回场景</button><button class="primary" id="collectBtn">收下证据一 ✓</button></div>`);$('closeBtn').onclick=close;$('collectBtn').onclick=()=>{mark('accident');close();toast('已收集第3段行动证据');};}
function teacherMemory2(){show(`<div class="eyebrow">I DO · 教师示范 2/2</div><h2>第二处证据：受伤后的关心</h2><div class="quote">第4段：“丽华手臂缠着纱布走进教室。……她却关心地问我：‘你没事吧？’”</div><p><strong>教师 Think-Aloud：</strong>“丽华自己受伤，仍然先关心‘我’。联系第3段保护朋友的动作，我更有依据推论：她善良、关心他人。”</p><div class="checklist"><strong>老师自我检查：</strong><div>① 我找到课文里的两处言行了吗？</div><div>② 为什么这两处证据说明她关心别人？</div><div>③ 我有没有把游戏补充的画面当成原文事实？</div></div><div class="modal-actions"><button class="secondary" id="closeBtn">返回</button><button class="primary" id="collectBtn">收下证据二 ✓</button></div>`);$('closeBtn').onclick=close;$('collectBtn').onclick=()=>{mark('bandage');close();toast('两处证据已整理');};}
function campusGate(){quizModal({label:'第一幕出口',heading:'结合第3、4段，哪些是课文中表现丽华关心他人的证据？（选两项）',options:['丽华推开“我”，自己却摔倒受伤。','丽华要求“我”把手表换回来。','丽华受伤后仍先问“我”有没有事。','丽华因为手表的事情责怪“我”。'],correct:[0,2],multi:true,hint:'回忆老师刚才点击的“脚踏车”和“纱布”两个任务点。',why:'再核对第3、4段。这关要选两处真正来自原文、支持人物特点的言行。',id:'exit',onSuccess:()=>sceneStart(1)});}
function watchQuest(){quizModal({label:'心意线索 · 第5段',heading:'“我”为什么选叔叔送的名贵手表作为送别礼物？',quote:'第5段：“丽华说她要随父母移居海外，我非常难过。我想送她一份珍贵的礼物……最后选择了叔叔给我的那只手表。”',options:['为了向丽华炫耀自己有一只名贵的手表。','为了表达对这段友谊的珍惜。','因为丽华要求“我”送她名贵手表。'],correct:[1],hint:'回想两人相识及丽华曾帮助“我”的经过，再阅读第5段。',why:'第5段写出“我”因为丽华将离开而非常难过，想用一份珍贵的礼物表达心意。',id:'watch'});}

function evidenceStation(){show(`<div class="eyebrow">WE DO · 证据整合站 · 第3–4、8段</div><h2>同一人物，前后的言行有什么联系？</h2><p>现在不是复述故事，而是把<strong>不同时候的相关证据</strong>联系起来，说明人物特点。</p><div class="quote"><strong>前面的言行：</strong>第3段丽华推开“我”，自己摔倒受伤；第4段她受伤后仍先关心“我”。<br/><strong>后来的言行：</strong>第8段丽华归还手表，拍拍“我”的肩膀，并安慰“我”。</div><p><strong>闯关题：</strong>哪一项最合理地连接了这些言行与丽华的特点？</p>${optionsHTML(['丽华前后都考虑朋友的感受：先保护、关心“我”，后来理解并安慰“我”，体现她善良、体贴。','丽华最关心手表的价钱，因此愿意和“我”做朋友。','丽华因为害怕妈妈，所以把手表还给“我”。'])}<details class="support"><summary>🧩 需要帮助？</summary><p>找依据：她分别做了什么？　作推论：这些表现有什么共同点？　联主题：朋友之间除了互相帮助，还需要什么？</p><p>词汇：体谅（tǐ liàng, be considerate）；珍惜（zhēn xī, cherish）。</p></details><div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回场景</button><button class="primary" id="checkBtn">检查我的推论</button><button class="primary" id="continueBtn" style="display:none">写出自己的解释 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0],{id:'evidenceChoice',after:evidenceWrite},'请检查：你的推论是否同时符合第3–4段与第8段的事实？');}
function evidenceWrite(){show(`<div class="eyebrow">WE DO · 解释记录（不自动评分）</div><h2>用自己的话说明理由</h2><p>请用一到两句话写出：丽华前后的哪些言行体现她关心、体谅朋友？为什么？</p><textarea id="bridgeWrite" class="text-entry" placeholder="从丽华……和……可以看出她……，因为……">${esc(state.bridgeAnswer||'')}</textarea><div class="note">游戏只记录这次解释，不根据字数或关键词判断阅读质量。教师会在线下讨论及课堂文字作答中帮助大家完善。</div><details class="support"><summary>句式支架 / English</summary><p>从第____段的____和第____段的____，可以看出丽华____，因为____。</p><p>体谅 — to be understanding; 关心 — care for others; 推论 — inference.</p></details><div class="modal-actions"><button class="secondary" id="backBtn">再看证据</button><button class="primary" id="saveBtn">保存我的解释并解锁讨论站 →</button></div>`);$('backBtn').onclick=evidenceStation;$('bridgeWrite').addEventListener('input',ev=>{state.bridgeAnswer=ev.target.value;persist()});$('saveBtn').onclick=()=>{const t=$('bridgeWrite').value.trim();if(t.length<8){toast('试着写出一项人物言行及你的解释');return}state.bridgeAnswer=t;mark('evidence');close();toast('已记录解释；请在课堂讨论中核对');};}
function classroomCheckpoint(){mark('classExit');show(`<div class="eyebrow">✓ 第二幕完成 · 线下教学暂停点</div><h2>暂停游戏，回到《手表》原文</h2><div class="checklist"><strong>师生讨论（对应成功标准）</strong><p>① 第3–4段与第8段中，丽华怎样关心、体谅“我”？请用两处原文依据说明。（SC1）</p><p>② 为什么“我”在第9段流泪？这些情节让你明白朋友之间应该怎样相处？（SC2）</p><p>③ 如果你收到不喜欢但朋友用心准备的礼物，你会怎样回应？为什么？（SC3）</p></div><div class="note"><strong>我的游戏初步解释：</strong><br/>${esc(state.bridgeAnswer||'尚未填写')}</div><p>接下来在学校允许的平台上完成：<strong>独立文字初稿 → 根据成功标准自评 → 修改并写一句反思</strong>。</p><div class="modal-actions"><button class="secondary" id="backBtn">返回门口回看</button><button class="secondary" id="copyBtn">复制游戏中的解释</button><button class="primary" id="nextBtn">课堂结束后，开启课后新故事 →</button></div>`);$('backBtn').onclick=close;$('copyBtn').onclick=()=>{const t=state.bridgeAnswer||'';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制初步解释')).catch(()=>toast('复制未成功，请手动选择文字'))}else toast('可手动选择上方文字复制')};$('nextBtn').onclick=()=>{close();sceneStart(2)};}
const NEWTEXT='小杰不小心弄坏了小组的展示板。他原本想悄悄离开，但看见组员还在认真准备，便决定留下来。他主动承认错误，并花了一个小时修补展示板。第二天，他提早来到学校，检查展示板是否完好。';
function homeEvidence(id){const first=id==='display';show(`<div class="eyebrow">课后新文本 · 找依据</div><h2>${first?'线索一：展示板':'线索二：主动补救'}</h2><div class="quote">${first?'“小杰不小心弄坏了小组的展示板。他原本想悄悄离开，但看见组员还在认真准备，便决定留下来。”':'“他主动承认错误，并花了一个小时修补展示板。第二天，他提早来到学校，检查展示板是否完好。”'}</div><p>想想：这些行动说明小杰怎样对待自己的错误？先记住证据，稍后独立作答。</p><div class="modal-actions"><button class="secondary" id="backBtn">回场景</button><button class="primary" id="takeBtn">记录这处言行 ✓</button></div>`);$('backBtn').onclick=close;$('takeBtn').onclick=()=>{mark(id);close();};}
function homeGate(){show(`<div class="eyebrow">课后独立挑战 · You Do</div><h2>用阅读方法解决新故事</h2><div class="quote">${NEWTEXT}</div><p><strong>Q1｜哪些是小杰主动承担责任的言行？（选择两项）</strong></p>${optionsHTML(['他想过悄悄离开，但最终决定留下来。','其他同学都没有来学校。','他主动承认错误并修补展示板。','他把展示板丢掉，不再理会。'],true)}<div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">回场景</button><button class="primary" id="checkBtn">核对文本证据</button><button class="primary" id="continueBtn" style="display:none">继续人物分析 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0,2],{id:'homeEvidenceGate',after:homeTraitQuest},'请找出小杰真实做过的事，而不是其他人或没有发生的事情。',true);}
function homeTraitQuest(){show(`<div class="eyebrow">课后独立挑战 · 作推论</div><h2>结合刚才两处言行，可以看出小杰怎样的特点？</h2>${optionsHTML(['勇于承担责任，愿意补救错误。','从不犯错误，所以不用道歉。','只关心自己的东西，从不帮助别人。'])}<details class="support"><summary>需要提示？</summary><p>看他决定留下、主动承认错误、花时间修补的行动，再想人物特点。</p></details><div id="feedback"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回</button><button class="primary" id="checkBtn">核对推论</button><button class="primary" id="continueBtn" style="display:none">独立表达主题 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0],{id:'homeTraitGate',after:homeWriting},'请解释他的行动为什么体现承担责任，而不只是看到“错误”就作判断。');}

 if(lihua){ctx.beginPath();ctx.ellipse(w*.41,-h*.8,w*.18,h*.28,-.22,0,6.283);ctx.fill();}

 round(-w*.21,-h*.46,w*.42,h*.24,w*.08,'#fffefa');round(-w*.29,-h*.42,w*.13,h*.18,w*.065,'#fffefa');round(w*.16,-h*.42,w*.13,h*.18,w*.065,'#fffefa');

 // blue skirt and pleats
 ctx.fillStyle=other?'#7e9caf':'#5678a8';ctx.beginPath();ctx.moveTo(-w*.22,-h*.26);ctx.lineTo(w*.22,-h*.26);ctx.lineTo(w*.35,-h*.14);ctx.lineTo(-w*.35,-h*.14);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#dae3ef80';ctx.lineWidth=Math.max(1,h*.009);for(let a of [-.21,0,.21]){ctx.beginPath();ctx.moveTo(a*w,-h*.255);ctx.lineTo(a*w*1.45,-h*.153);ctx.stroke()}

 if(!lihua&&!other){round(-w*.36,-h*.54,w*.14,h*.30,w*.08,'#c8bba0');ctx.strokeStyle='#b2a789';ctx.lineWidth=w*.045;ctx.beginPath();ctx.moveTo(-w*.145,-h*.48);ctx.lineTo(-w*.12,-h*.3);ctx.stroke();}

function drawGlows(){for(let it of stageItems()){let p=project([it.x,.08,it.z]);if(!p)continue;let r=clamp(p.s*.58,10,45);ctx.save();ctx.strokeStyle=isDone(it.id)?'#7cc59488':isLocked(it.id)?'#afbcb48c':'#ffe59c';ctx.lineWidth=3;ctx.setLineDash([4,5]);ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.37,0,0,Math.PI*2);ctx.stroke();ctx.restore();}}
function drawFlowerBeds(){
 ctx.save();
 for(let j=0;j<45;j++){
   const xx=(j*7.37)%13.2-6.6,zz=(j*3.43)%11.2-5.6;
   if(state.scene===1&&Math.abs(xx)<2.8&&zz<-2.9)continue;
   const p=project([xx,.05,zz]);if(!p||p.d>25)continue;
   const r=clamp(p.s*.042,1.2,4.8);ctx.globalAlpha=.67;
   ctx.fillStyle=j%3===0?'#fff4df':'#ffdc94';
   for(let k=0;k<5;k++){const t=k*6.283/5;ctx.beginPath();ctx.ellipse(p.x+Math.cos(t)*r,p.y+Math.sin(t)*r*.8,r*.62,r*.48,t,0,6.283);ctx.fill()}
   ctx.fillStyle='#e6ae4b';ctx.beginPath();ctx.arc(p.x,p.y,r*.42,0,6.283);ctx.fill();
 }
 ctx.restore();
}
function drawWorld(){drawSky();updateCamera();worldBuild();ctx.save();ctx.globalAlpha=.51;painterFaces();ctx.restore();drawFlowerBeds();let ordered=sprites.map(s=>({...s,p:project([s.x,0,s.z])})).filter(x=>x.p).sort((a,b)=>b.p.d-a.p.d);for(let s of ordered)drawPerson(s.x,s.z,s.kind,s.scale,s.fallen);drawPerson(state.player.x,state.player.z,state.scene===2?'narrator':'narrator',1.05,false,Math.abs(lastMove)>0);drawGlows();}
let lastMove=0;
function renderMarkers(){markers.innerHTML='';for(let it of stageItems()){let b=document.createElement('button');b.className='hotspot';b.dataset.id=it.id;b.type='button';b.textContent=it.label;b.addEventListener('click',()=>{const d=Math.hypot(state.player.x-it.x,state.player.z-it.z);if(d<2.3)interact(it);else{toast('先走近任务点（可按方向键）');state.autowalk={x:it.x,z:it.z,id:it.id};}});markers.append(b);}}
function updateMarkers(){for(let it of stageItems()){let el=markers.querySelector(`[data-id="${it.id}"]`);if(!el)continue;let p=project([it.x,1.25,it.z]);let d=Math.hypot(state.player.x-it.x,state.player.z-it.z);if(p){el.style.display='block';el.style.left=p.x+'px';el.style.top=p.y+'px';el.classList.toggle('near',d<2.3);el.classList.toggle('locked',isLocked(it.id));el.classList.toggle('done',isDone(it.id));el.textContent=(isDone(it.id)?'✓ ':isLocked(it.id)?'🔒 ':'✦ ')+it.label;}else el.style.display='none';}}
function move(dt){if(state.activeModal)return;let x=0,z=0;if(keydown.has('w')||keydown.has('arrowup')||touchDirections.has('up'))z--;if(keydown.has('s')||keydown.has('arrowdown')||touchDirections.has('down'))z++;if(keydown.has('a')||keydown.has('arrowleft')||touchDirections.has('left'))x--;if(keydown.has('d')||keydown.has('arrowright')||touchDirections.has('right'))x++;if(!x&&!z&&state.autowalk){let dx=state.autowalk.x-state.player.x,dz=state.autowalk.z-state.player.z,d=Math.hypot(dx,dz);if(d>1.5){x=dx/d;z=dz/d}else{let target=stageItems().find(t=>t.id===state.autowalk.id);state.autowalk=null;if(target)interact(target);}}if(x||z){let inv=1/(Math.hypot(x,z)||1),step=dt*3.15;state.player.x=clamp(state.player.x+x*inv*step,-6.25,6.25);state.player.z=clamp(state.player.z+z*inv*step,-5.2,5.35);lastMove=1;}else lastMove=0;let n=nearest();if(n&&n.dist>1.32)state.insideHotspotId=null;if(n&&n.dist<.79&&!isLocked(n.id)&&!isDone(n.id)&&state.insideHotspotId!==n.id){state.insideHotspotId=n.id;interact(n)}}
function resize(){const r=app.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function animate(t){let dt=Math.min(.05,(t-lastT)/1000);lastT=t;clock+=dt;move(dt);drawWorld();updateMarkers();requestAnimationFrame(animate)}
renderUI();renderMarkers();welcome();requestAnimationFrame(animate);
})();
