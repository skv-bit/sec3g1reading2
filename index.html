function isDone(id){return !!state.done[id]}
function mark(id){state.done[id]=true;persist();renderUI();}
function stageItems(){return ITEMS[state.scene]}
function isLocked(id){if(state.scene===0)return id==='bandage'&&!isDone('accident')||id==='exit'&&!isDone('bandage');if(state.scene===1)return id==='watch'&&!isDone('bell')||id==='door'&&!isDone('watch')||id==='evidence'&&!isDone('door')||id==='classExit'&&!isDone('evidence');return id==='repair'&&!isDone('display')||id==='finish'&&!isDone('repair');}
function nextTarget(){return stageItems().find(x=>!isDone(x.id))||stageItems().at(-1)}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){overlay.classList.remove('hidden');state.activeModal=true;modal.innerHTML=html;const focus=modal.querySelector('button');if(focus)focus.focus();}
function close(){overlay.classList.add('hidden');state.activeModal=false;modal.innerHTML='';try{speechSynthesis.cancel()}catch(e){}}
function speakText(text){try{if(!('speechSynthesis' in window)){toast('此浏览器暂不支持语音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.94;u.pitch=1.02;const voices=speechSynthesis.getVoices?.()||[];const zh=voices.find(v=>/zh|Chinese|普通话|国语/i.test(v.lang+' '+v.name));if(zh)u.voice=zh;speechSynthesis.speak(u)}catch(e){toast('语音播放暂时不可用')}}

function choicesSetup(correct,ok, wrongText,multi=false){let selected=new Set();document.querySelectorAll('#answers .choice').forEach(b=>b.addEventListener('click',()=>{let i=Number(b.dataset.choice);if(!multi)selected.clear();if(multi&&selected.has(i))selected.delete(i);else selected.add(i);document.querySelectorAll('#answers .choice').forEach(c=>{let on=selected.has(Number(c.dataset.choice));c.classList.toggle('selected',on);c.querySelector('.mark').textContent=multi?(on?'☑':'□'):String.fromCharCode(65+Number(c.dataset.choice))})}));$('checkBtn').addEventListener('click',()=>{let pass=selected.size===correct.length&&correct.every(x=>selected.has(x));if(pass){$('feedback').className='feedback ok';$('feedback').innerHTML='✓ 阅读证据正确！关卡已解锁。';$('checkBtn').disabled=true;mark(ok.id);const done=$('continueBtn');if(done){done.style.display='inline-block';done.addEventListener('click',()=>{close();if(ok.after)ok.after()})}toast('✨ 线索解锁！');}else{$('feedback').className='feedback';$('feedback').textContent=wrongText;toast('再找一找原文线索');}});}
function quizModal({label,heading,quote,image='',options,correct,multi=false,hint,why,id,onSuccess,reviewLabel='',onReview}){show(`<div class="eyebrow">✧ 闯关任务 · ${esc(label)}</div><h2>${esc(heading)}</h2>${quote?`<div class="quote">${esc(quote)}</div>`:''}${image?`<img class="story-illustration" src="${image}" alt="题目插图"/>`:''}${optionsHTML(options,multi)}<details class="support"><summary>🧩 需要提示？点击查看</summary>${hint}</details><div id="feedback" aria-live="polite"></div><div class="modal-actions compact"><div>${onReview?`<button class="secondary" id="reviewBtn">${esc(reviewLabel||'重看线索')}</button>`:''}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary" id="backBtn">返回</button><button class="primary" id="checkBtn">检查</button><button class="primary" id="continueBtn" style="display:none">继续探索 →</button></div></div>`);$('backBtn').onclick=close;if(onReview&&$('reviewBtn'))$('reviewBtn').onclick=onReview;choicesSetup(correct,{id,after:()=>{if(onSuccess)onSuccess()}},why,multi)}
function teacherMemory1(){show(`<div class="eyebrow">I DO · 教师示范 1/2</div><h2>第一处证据：危险时刻</h2><div class="quote">第3段："丽华连忙推开我，结果自己却摔倒在地上。她擦伤了手臂，我反而没事。"</div><img class="story-illustration" src="${lineImage(0)}" alt="脚踏车事件插图"/><div class="audio-row"><button class="secondary" id="playTeacher1">▶ 播放教师示范语音</button><span class="audio-note">点击播放，不直接显示 Think-Aloud 文字。</span></div><div class="modal-actions"><button class="secondary" id="closeBtn">返回</button><button class="primary" id="collectBtn">收下证据一 ✓</button></div>`);$('playTeacher1').onclick=()=>speakText('我先想到，丽华可能很关心别人。不过，我要检查自己的判断，还有没有另一处言行可以支持。');$('closeBtn').onclick=close;$('collectBtn').onclick=()=>{mark('accident');close();toast('已收集第3段行动证据');};}
function teacherMemory2(){show(`<div class="eyebrow">I DO · 教师示范 2/2</div><h2>第二处证据：受伤后的关心</h2><div class="quote">第4段："丽华手臂缠着纱布走进教室。……她却关心地问我：‘你没事吧？’"</div><img class="story-illustration" src="${lineImage(0)}" alt="第二天的纱布插图"/><div class="audio-row"><button class="secondary" id="playTeacher2">▶ 播放教师示范语音</button><span class="audio-note">点击播放，不直接显示 Think-Aloud 文字。</span></div><div class="modal-actions"><button class="secondary" id="closeBtn">返回</button><button class="primary" id="collectBtn">收下证据二 ✓</button></div>`);$('playTeacher2').onclick=()=>speakText('丽华自己受伤，仍然先关心我。联系第3段保护朋友的动作，我更有依据推论，她善良，关心他人。');$('closeBtn').onclick=close;$('collectBtn').onclick=()=>{mark('bandage');close();toast('两处证据已整理');};}

function watchQuest(){quizModal({label:'心意线索 · 第5段',heading:'“我”为什么把叔叔送的名贵手表给丽华？',quote:'第5段：“丽华说她要随父母移居海外，我非常难过。我想送她一份珍贵的礼物……最后选择了叔叔给我的那只手表。”',image:lineImage(1),options:['为了让丽华知道“我”有一只名贵的手表。','因为我很珍惜“我”和丽华的友谊。','因为丽华要求“我”送她名贵手表。'],correct:[1],hint:vocabHint([['名贵','míng guì','valuable'],['叔叔','shū shu','uncle'],['移居海外','yí jū hǎi wài','move overseas'],['选择','xuǎn zé','to choose'],['珍贵','zhēn guì','precious'],['要求','yāo qiú','to request']]),why:'第5段写出“我”因为丽华将离开而非常难过，想用一份珍贵的礼物表达心意。',id:'watch',reviewLabel:'重看手表线索',onReview:()=>clueCard({eyebrow:'WE DO · 线索回看',heading:'手表的心意',quote:'第5段：我非常难过，想送丽华一份珍贵的礼物，最后选择了叔叔给我的那只手表。',image:lineImage(1),back:watchQuest})});}

function actualEnding(){show(`<div class="eyebrow">WE DO · 原文第8段</div><h2>丽华的回应</h2><div class="quote">第8段："她把表还给我，拍拍我的肩膀，对我说：‘礼物是一份心意，只要是你送的，我都喜欢。我们永远是最好的朋友！’"</div><img class="story-illustration" src="${lineImage(1)}" alt="丽华把手表还给我"/><p><strong>闯关题：</strong>从哪里可以看出丽华体谅“我”？</p>${optionsHTML(['把手表还给“我”，还拍拍“我”的肩膀。','“我”几次伸手，又把手缩回来。','说“礼物是一份心意，只要是你送的，我都喜欢”。'],true)}<details class="support"><summary>🧩 需要提示？点击查看</summary>${vocabHint([['体谅','tǐ liàng','to be understanding'],['肩膀','jiān bǎng','shoulder'],['心意','xīn yì','kind intention'],['缩','suō','to shrink back']])}</details><div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回</button><button class="primary" id="checkBtn">检查</button><button class="primary" id="continueBtn" style="display:none">继续 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0,2],{id:'door'},'再看第8段，题目要找的是丽华本人的言行。',true);} 
function evidenceStation(){show(`<div class="eyebrow">WE DO · 证据整合站 · 第3–4、8段</div><h2>线索连连看：丽华到底是个怎样的人？</h2><p><strong>把丽华做过的两件事连起来看，猜猜她的性格。</strong></p><div class="quote">🔎 <strong>线索一（第3–4段）：</strong>丽华推开我，自己<strong>摔跤</strong>受伤了，却先问我有没有事。<br/><br/>🔎 <strong>线索二（第8段）：</strong>丽华把手表还给我，还<strong>拍拍我的肩膀，安慰</strong>我。</div><img class="story-illustration" src="${lineImage(1)}" alt="丽华归还手表的情境插图"/><p><strong>闯关题：从这两条线索可以看出，丽华是一个怎样的人？</strong></p>${optionsHTML(['她两次都先想到朋友。她不仅关心我，也很体谅我，是一个友善、无私的好朋友。','她只在乎那只手表贵不贵，所以才愿意跟我做朋友。','她心里其实很害怕我的妈妈生气，所以才赶紧把表还给我。'])}<div id="feedback" aria-live="polite"></div><div class="modal-actions compact"><div><button class="secondary" id="reviewBtn">回看线索</button></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary" id="backBtn">返回</button><button class="primary" id="checkBtn">检查</button><button class="primary" id="continueBtn" style="display:none">写一写 →</button></div></div>`);$('backBtn').onclick=close;$('reviewBtn').onclick=()=>clueCard({eyebrow:'WE DO · 线索回看',heading:'线索连连看',quote:"线索一（第3–4段）：丽华推开我，自己摔跤受伤了，却先问我有没有事。\n\n线索二（第8段）：丽华把手表还给我，还拍拍我的肩膀，安慰我。",image:lineImage(1),back:evidenceStation});choicesSetup([0],{id:'evidenceChoice',after:awardWeDoBadge},'请想一想：哪一个答案真正说明了丽华怎么对待朋友？');}
function evidenceWrite(){show(`<div class="eyebrow">WE DO · 侦探笔记</div><h2>写下你的发现！</h2><p>请动动脑筋：把丽华做的事和她的性格连起来，写写她为什么这么做。</p><textarea id="bridgeWrite" class="text-entry" placeholder="课文写到丽华__________（做的事），可以看出她是一个__________的人，因为她心里想的是__________。">${esc(state.bridgeAnswer||'')}</textarea><div class="note">💡 别担心写错！大胆写下你的想法，等会儿老师会在课堂上和大家一起讨论。</div><details class="support"><summary>词语百宝箱 / Word Bank（你可以用这些词填空）</summary><p><strong>做的事 (Action)：</strong> 拍拍肩膀（pat on the shoulder）、安慰（comfort）</p><p><strong>性格 (Character)：</strong> 友善（friendly）、无私（selfless）</p><p><strong>心里想的 (Thoughts)：</strong> 关心（care）、体谅（understanding）</p></details><div class="modal-actions"><button class="secondary" id="backBtn">回看线索</button><button class="primary" id="saveBtn">提交笔记，进入下一关 →</button></div>`);$('backBtn').onclick=evidenceStation;$('bridgeWrite').addEventListener('input',ev=>{state.bridgeAnswer=ev.target.value;persist()});$('saveBtn').onclick=()=>{const t=$('bridgeWrite').value.trim();if(t.length<8){toast('先写下你找到的线索和想法');return}state.bridgeAnswer=t;mark('evidence');persist();classroomCheckpoint();};}
function classroomCheckpoint(){mark('classExit');show(`<div class="eyebrow">🎯 第二关完成！· 班级情报交流时间</div><h2>先别急着通关，和老师同学聊一聊！</h2><div class="checklist"><strong>💬 课堂讨论站：</strong><p>① <strong>找线索 (See)：</strong> 丽华做了哪两件事，让你觉得她很体贴、很照顾“我”？</p><p>② <strong>猜心理 (Think)：</strong> 为什么“我”在最后流眼泪了？这让你明白交朋友最重要的是什么？</p><p>③ <strong>联生活 (Connect)：</strong> 如果朋友用心准备的礼物，你刚好不喜欢，你会怎么回应？为什么？</p></div><div class="note"><strong>📝 我在上一关的侦探笔记：</strong><br/>${esc(state.bridgeAnswer||"课文写到丽华__________（做的事），可以看出她是一个__________的人，因为她心里想的是__________。")}</div><p><strong>🚀 下一步挑战：</strong>在班级讨论板上，把你的笔记变成一段通顺的话，并给同桌的留言点个赞！</p><div class="modal-actions"><button class="secondary" id="backBtn">回看我的线索</button><button class="secondary" id="copyBtn">一键复制我的笔记</button><button class="primary" id="nextBtn">下课后再来解锁新故事 →</button></div>`);$('backBtn').onclick=evidenceStation;$('copyBtn').onclick=()=>{const t=state.bridgeAnswer||'';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制你的侦探笔记')).catch(()=>toast('复制未成功，请手动选择文字'))}else toast('可手动选择上方文字复制')};$('nextBtn').onclick=()=>{close();sceneStart(2)};}
const NEWTEXT='小杰不小心弄坏了小组的展示板。他原本想悄悄离开，但看见组员还在认真准备，便决定留下来。他主动承认错误，并花了一个小时修补展示板。第二天，他提早来到学校，检查展示板是否完好。';
function homeEvidence(id){const first=id==='display';show(`<div class="eyebrow">课后新文本 · 找依据</div><h2>${first?'线索一：展示板':'线索二：主动补救'}</h2><div class="quote">${first?'“小杰不小心弄坏了小组的展示板。他原本想悄悄离开，但看见组员还在认真准备，便决定留下来。”':'“他主动承认错误，并花了一个小时修补展示板。第二天，他提早来到学校，检查展示板是否完好。”'}</div><p>想想：这些行动说明小杰怎样对待自己的错误？先记住证据，稍后独立作答。</p><div class="modal-actions"><button class="secondary" id="backBtn">回场景</button><button class="primary" id="takeBtn">记录这处言行 ✓</button></div>`);$('backBtn').onclick=close;$('takeBtn').onclick=()=>{mark(id);close();};}
function homeGate(){show(`<div class="eyebrow">课后独立挑战 · You Do</div><h2>用阅读方法解决新故事</h2><div class="quote">${NEWTEXT}</div><p><strong>Q1｜哪些是小杰主动承担责任的言行？（选择两项）</strong></p>${optionsHTML(['他想过悄悄离开，但最终决定留下来。','其他同学都没有来学校。','他主动承认错误并修补展示板。','他把展示板丢掉，不再理会。'],true)}<div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">回场景</button><button class="primary" id="checkBtn">核对文本证据</button><button class="primary" id="continueBtn" style="display:none">继续人物分析 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0,2],{id:'homeEvidenceGate',after:homeTraitQuest},'请找出小杰真实做过的事，而不是其他人或没有发生的事情。',true);}
function homeTraitQuest(){show(`<div class="eyebrow">课后独立挑战 · 作推论</div><h2>结合刚才两处言行，可以看出小杰怎样的特点？</h2>${optionsHTML(['勇于承担责任，愿意补救错误。','从不犯错误，所以不用道歉。','只关心自己的东西，从不帮助别人。'])}<details class="support"><summary>需要提示？</summary><p>看他决定留下、主动承认错误、花时间修补的行动，再想人物特点。</p></details><div id="feedback"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回</button><button class="primary" id="checkBtn">核对推论</button><button class="primary" id="continueBtn" style="display:none">独立表达主题 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0],{id:'homeTraitGate',after:homeWriting},'请解释他的行动为什么体现承担责任，而不只是看到“错误”就作判断。');}
function homeWriting(){show(`<div class="eyebrow">课后独立挑战 · 联主题</div><h2>阅读侦探的最后一关</h2><p>请用自己的话写出故事让你明白的一个道理，并说出小杰的哪一个行为支持你的理解。</p><textarea id="homeWrite" class="text-entry" placeholder="我明白……因为小杰……">${esc(state.homeAnswer||'')}</textarea><details class="support"><summary>✦ 我需要拼音 / English / 句式支架</summary><p>承担责任（chéng dān zé rèn）— to take responsibility.</p><p>句式：“这个故事让我明白________。因为小杰________，可以看出________。”</p></details><div class="note">开放式答案不会由游戏自动判断好坏。完成后请按教师要求提交课堂平台，让教师查看你的解释。</div><div class="modal-actions"><button class="secondary" id="backBtn">返回</button><button class="primary" id="saveBtn">保存我的回答 →</button></div>`);$('backBtn').onclick=close;$('homeWrite').addEventListener('input',e=>state.homeAnswer=e.target.value);$('saveBtn').onclick=()=>{let a=$('homeWrite').value.trim();if(a.length<8){toast('请写出至少一句有意义的解释');$('homeWrite').focus();return}state.homeAnswer=a;persist();homeSelfCheck();};}
function homeSelfCheck(){show(`<div class="eyebrow">元认知自评 · 检查与修正</div><h2>我怎样让自己的解释更有依据？</h2><div class="quote" id="draftView">${esc(state.homeAnswer)}</div><div class="checklist"><label><input type="checkbox" id="check1"> 我引用了文本中的具体言行。</label><label><input type="checkbox" id="check2"> 我解释了人物特点或故事道理。</label><label><input type="checkbox" id="check3"> 我的理由和证据有关系。</label></div><p>现在请尝试改进自己的初稿（如果已经清楚，可以保留并说明理由）。</p><textarea id="homeRevise" class="text-entry" placeholder="我的修改稿……">${esc(state.homeDraft||state.homeAnswer)}</textarea><label style="display:block;font-size:13px;font-weight:bold">我的反思（例如：我原本……后来……）</label><textarea id="homeReflect" class="text-entry" style="min-height:56px" placeholder="我检查了……，并……">${esc(state.homeReflect||'')}</textarea><div class="modal-actions"><button class="secondary" id="backBtn">返回修改前</button><button class="primary" id="finishBtn">完成课后挑战 ✦</button></div>`);$('backBtn').onclick=homeWriting;$('finishBtn').onclick=()=>{let draft=$('homeRevise').value.trim(),reflect=$('homeReflect').value.trim();if(draft.length<8||reflect.length<5){toast('请填写修改稿与简短反思');return}state.homeDraft=draft;state.homeReflect=reflect;mark('finish');state.badge=true;persist();showBadge();};}

 ctx.strokeStyle='#ab635b';ctx.lineWidth=Math.max(1.3,h*.009);ctx.beginPath();ctx.arc(0,-h*.627,w*.045,.08,Math.PI-.1);ctx.stroke();
 // character-specific headwear
 if(lihua){ctx.fillStyle='#89bee8';ctx.beginPath();ctx.ellipse(w*.36,-h*.88,w*.13,h*.075,0,0,6.283);ctx.fill();ctx.fillStyle='#d8edfa';ctx.beginPath();ctx.ellipse(w*.36,-h*.87,w*.055,h*.03,0,0,6.283);ctx.fill()}
 if(!lihua&&!other){ctx.fillStyle='#fff9ec';ctx.beginPath();ctx.ellipse(0,-h*.906,w*.42,h*.081,-.03,0,6.283);ctx.fill();ctx.fillStyle='#fffbee';ctx.beginPath();ctx.ellipse(0,-h*.969,w*.275,h*.125,0,Math.PI,2*Math.PI);ctx.lineTo(w*.24,-h*.916);ctx.lineTo(-w*.24,-h*.916);ctx.closePath();ctx.fill();ctx.strokeStyle='#cfbda4';ctx.lineWidth=Math.max(1,h*.008);ctx.beginPath();ctx.ellipse(0,-h*.912,w*.40,h*.079,-.03,0,Math.PI);ctx.stroke();ctx.fillStyle='#5c6b67';ctx.font='bold '+Math.round(h*.06)+'px sans-serif';ctx.fillText('✿',-w*.13,-h*.976)}
 ctx.restore();
}
function drawGlows(){for(let it of stageItems()){let p=project([it.x,.08,it.z]);if(!p)continue;let r=clamp(p.s*.58,10,45);ctx.save();ctx.strokeStyle=isDone(it.id)?'#7cc59488':isLocked(it.id)?'#afbcb48c':'#ffe59c';ctx.lineWidth=3;ctx.setLineDash([4,5]);ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.37,0,0,Math.PI*2);ctx.stroke();ctx.restore();}}
function drawWorld(){drawSky();updateCamera();worldBuild();ctx.save();ctx.globalAlpha=.44;painterFaces();ctx.restore();let ordered=sprites.map(s=>({...s,p:project([s.x,0,s.z])})).filter(x=>x.p).sort((a,b)=>b.p.d-a.p.d);for(let s of ordered)drawPerson(s.x,s.z,s.kind,s.scale,s.fallen);drawPerson(state.player.x,state.player.z,state.scene===2?'narrator':'narrator',1.05,false,Math.abs(lastMove)>0);drawGlows();}
let lastMove=0;
function renderMarkers(){markers.innerHTML='';for(let it of stageItems()){let b=document.createElement('button');b.className='hotspot';b.dataset.id=it.id;b.type='button';b.textContent=it.label;b.addEventListener('click',()=>{const d=Math.hypot(state.player.x-it.x,state.player.z-it.z);if(d<2.3)interact(it);else{toast('先走近任务点（可按方向键）');state.autowalk={x:it.x,z:it.z,id:it.id};}});markers.append(b);}}
function updateMarkers(){for(let it of stageItems()){let el=markers.querySelector(`[data-id="${it.id}"]`);if(!el)continue;let p=project([it.x,1.25,it.z]);let d=Math.hypot(state.player.x-it.x,state.player.z-it.z);if(p){el.style.display='block';el.style.left=p.x+'px';el.style.top=p.y+'px';el.classList.toggle('near',d<2.3);el.classList.toggle('locked',isLocked(it.id));el.classList.toggle('done',isDone(it.id));el.textContent=(isDone(it.id)?'✓ ':isLocked(it.id)?'🔒 ':'✦ ')+it.label;}else el.style.display='none';}}
function move(dt){if(state.activeModal)return;let x=0,z=0;if(keydown.has('w')||keydown.has('arrowup')||touchDirections.has('up'))z--;if(keydown.has('s')||keydown.has('arrowdown')||touchDirections.has('down'))z++;if(keydown.has('a')||keydown.has('arrowleft')||touchDirections.has('left'))x--;if(keydown.has('d')||keydown.has('arrowright')||touchDirections.has('right'))x++;if(!x&&!z&&state.autowalk){let dx=state.autowalk.x-state.player.x,dz=state.autowalk.z-state.player.z,d=Math.hypot(dx,dz);if(d>1.5){x=dx/d;z=dz/d}else{let target=stageItems().find(t=>t.id===state.autowalk.id);state.autowalk=null;if(target)interact(target);}}if(x||z){let inv=1/(Math.hypot(x,z)||1),step=dt*3.15;state.player.x=clamp(state.player.x+x*inv*step,-6.25,6.25);state.player.z=clamp(state.player.z+z*inv*step,-5.2,5.35);lastMove=1;}else lastMove=0;let n=nearest();if(n&&n.dist>1.32)state.insideHotspotId=null;if(n&&n.dist<.79&&!isLocked(n.id)&&!isDone(n.id)&&state.insideHotspotId!==n.id){state.insideHotspotId=n.id;interact(n)}}
function resize(){const r=app.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function animate(t){let dt=Math.min(.05,(t-lastT)/1000);lastT=t;clock+=dt;move(dt);drawWorld();updateMarkers();requestAnimationFrame(animate)}
renderUI();renderMarkers();welcome();requestAnimationFrame(animate);
})();
</script>
