<style>

#hotspots{position:absolute;inset:0;z-index:5;pointer-events:none}.hotspot{position:absolute;transform:translate(-50%,-100%);border:2px solid #fff;background:linear-gradient(#fffef5,#fceab8);color:#366050;min-width:85px;padding:8px 11px;border-radius:20px;font-size:12px;font-weight:850;box-shadow:0 4px 0 #c6a866,0 9px 20px #2d503431;pointer-events:auto;white-space:nowrap}.hotspot:before{content:'✧';color:#e29e36;margin-right:4px}.hotspot.near{background:#dcf8db;border-color:#fff;box-shadow:0 4px 0 #7abf91,0 0 0 5px #f6ffad70}.hotspot.locked{opacity:.65;background:#edf1ef;box-shadow:none}.hotspot.done{background:#e1f5e5}.hotspot.done:before{content:'✓';color:#269b71}.hotspot:not(.near):not(.done){opacity:.85}

.modal{width:min(700px,100%);max-height:min(88dvh,820px);overflow:auto;border-radius:25px;background:#fffdf5;border:3px solid #fff;box-shadow:0 22px 70px #123c3d66;padding:24px 27px;position:relative}.modal:before{content:'';position:absolute;left:22px;right:22px;top:0;height:7px;border-radius:0 0 12px 12px;background:linear-gradient(90deg,#7fca92,#f7d76c,#f6ab9a)}.modal .eyebrow{font-size:12px;font-weight:900;color:#279275;letter-spacing:.08em}.modal h1,.modal h2{margin:8px 0 9px;line-height:1.35}.modal h1{font-size:clamp(25px,4vw,33px)}.modal h2{font-size:23px}.modal p{font-size:14px;line-height:1.85;color:#4b615a}.quote{border-left:4px solid #8db9a0;padding:12px 16px;background:#edf8ed;border-radius:0 13px 13px 0;margin:13px 0;font-size:15px;line-height:1.8;color:#284b3f}.note{font-size:12px;color:#657670;background:#fff5dd;border-radius:12px;padding:10px 13px;line-height:1.7}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}.choices{display:grid;gap:9px;margin:13px 0}.choice{background:#f5f9f1;border:1.5px solid #d5e4d7;text-align:left;padding:12px 14px;border-radius:13px;color:#334e48;font-size:14px}.choice.selected{background:#dcf1e0;border-color:#409879;box-shadow:inset 4px 0 #409879}.choice .mark{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;margin-right:7px;color:#258266;border-radius:50%;border:1px solid #a2c2ab}.feedback{padding:11px 13px;background:#fff0e4;border-radius:12px;color:#a65b3f;font-size:13px;line-height:1.7;margin-top:9px}.feedback.ok{background:#e2f5e5;color:#277a4c}.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.ending{border:1.5px solid #dfd9ca;background:#f9f7ed;padding:14px;border-radius:15px}.ending.a{background:#e9f7ea;border-color:#b5ddc3}.ending.b{background:#fff1e8;border-color:#f2c3ae}.ending strong{font-size:13px}.ending p{font-size:13px;line-height:1.8;margin:6px 0}.ending .who{display:flex;gap:8px;align-items:center}.role-dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:#6bb08d;border:3px solid #fffbec}.role-dot.b{background:#df9879}.support{margin-top:12px;border:1px dashed #aed0bb;background:#f8fcf2;border-radius:12px;padding:10px 12px}.support summary{cursor:pointer;font-weight:800;font-size:13px}.support p{margin:6px 0;font-size:13px}.mini-words{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini-words button{border:1px solid #c1d8cc;background:white;border-radius:9px;color:#327a5e;padding:6px 9px;font-size:12px}.text-entry{display:block;width:100%;min-height:78px;padding:10px;border:1.5px solid #b7d9c8;border-radius:12px;resize:vertical;background:#fff;color:#234;font-size:14px;line-height:1.6;margin:12px 0}.story-illustration{display:block;width:100%;height:170px;object-fit:cover;object-position:50% 42%;border-radius:14px;border:2px solid #f8e8c2;margin:12px 0}.badge-icon{font-size:55px;display:block;text-align:center}.checklist{background:#f4f8ef;border-radius:13px;padding:10px 14px;font-size:13px;line-height:1.8}.checklist label{display:block;margin:6px 0}.checklist input{accent-color:#29846c}.chapter-done{display:inline-block;background:#e9f5db;border:1px solid #c4dca7;color:#3b7755;border-radius:100px;padding:6px 12px;font-size:12px;font-weight:800}.warning{color:#a75241}#title-image{width:100%;height:105px;position:relative;overflow:hidden;background:linear-gradient(120deg,#c6eaf6,#fff4c4,#b9e4bf);border-radius:15px;margin:15px 0}#title-image .sun{position:absolute;right:50px;top:10px;background:#ffe08b;border-radius:100%;width:80px;height:80px;box-shadow:0 0 30px #fff4a0}#title-image .hills{position:absolute;bottom:-35px;left:-10px;width:115%;height:100px;background:#8bbd89;border-radius:50% 60% 0 0;box-shadow:inset 0 15px #abd19f}#title-image .house{position:absolute;bottom:10px;left:60px;background:#fff3db;width:90px;height:70px;border-radius:7px;border:2px solid #fff;box-shadow:0 5px #e2b989}#title-image .house:before{content:'';position:absolute;left:-11px;top:-28px;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:40px solid #aebed2}#title-image .door{position:absolute;bottom:10px;left:100px;background:#996b4d;width:22px;height:40px}
#help-tip{font-size:11px;color:#6c8077;margin-top:9px}#scene-fade{position:absolute;inset:0;background:#fff9ea;opacity:0;pointer-events:none;z-index:32;transition:opacity .25s}#scene-fade.on{opacity:1}
#footerlinks{display:flex;gap:9px;flex-wrap:wrap}
@media(max-width:800px){#helper{top:142px;width:220px}#objective{top:78px;max-width:calc(100% - 32px)}#topbar{gap:5px}#topbar .brand{padding:8px 11px}.brand strong{font-size:14px}.brand small{font-size:10px}.topgroup{gap:5px}.control{padding:8px;font-size:11px}#bottom{bottom:12px;left:10px;right:10px}#status{max-width:55%;padding:8px 10px}.status-top{font-size:12px}.status-bottom{font-size:10px}.dpad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,34px)}#moving{gap:5px}#moving .primary{padding:9px;font-size:12px}.hotspot{padding:7px 8px;font-size:11px;min-width:68px}.modal{padding:19px 17px}.modal h2{font-size:19px}.dual{grid-template-columns:1fr}#objective .objective-sub{display:none}}@media(max-width:480px){#topbar .control:nth-child(2){display:none}#helper{top:137px;right:10px;max-width:calc(100% - 20px)}#objective{top:70px}#bottom{align-items:flex-end}#status{max-width:50%}#moving .primary{max-width:77px;line-height:1.1}#topbar .pill{display:none}}
</style>

<body>
<main id="app" aria-label="《手表》友谊侦探互动场景">
 <canvas id="world" aria-label="角色可移动的透视场景"></canvas><div id="painterly"></div>
 <div id="topbar">
  <div class="topgroup"><div class="brand glass"><strong>⌚ 藏在言行里的心意</strong><small>《手表》· 友谊侦探 V5</small></div><div class="pill glass" id="chapterLabel">第一幕 · 校园回忆</div></div>
  <div class="topgroup"><button class="control" id="soundBtn" aria-pressed="false" title="轻微环境音，默认关闭">🔇 环境音：关</button><button class="control" id="helperBtn">🧠 思维助手</button><button class="control" id="restartBtn">↺ 重置</button></div>
 </div>
 <aside id="objective" class="glass"><div class="objective-tag">现在的任务 / CURRENT MISSION</div><div class="objective-title" id="objectiveTitle"></div><div class="objective-sub" id="objectiveSub"></div></aside>
 <aside id="helper" class="glass closed" aria-label="阅读思维鹰架"><strong>🧠 我的阅读助手</strong><div class="step"><span class="num">1</span>找依据：人物说了什么？做了什么？</div><div class="step"><span class="num">2</span>作推论：说明什么特点？为什么？</div><div class="step"><span class="num">3</span>联主题：从表现明白什么道理？</div><p>根据 Project Zero「What Makes You Say That?」的证据提问理念改编；「联主题」为本课教学补充。</p><button class="hint-btn" id="glossBtn">📖 查看拼音／英文词汇</button></aside>
 <div id="hotspots" aria-live="polite"></div>
 <div id="bottom"><div id="status" class="glass"><div class="status-top" id="statusTitle">🚶 用方向键移动，靠近光圈探索</div><div class="status-bottom" id="statusInfo">WASD / 方向键移动 · E 互动 · 点击黄色任务标记</div><div id="keys"><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span></div></div><div id="moving"><div class="dpad"><button class="up" data-dir="up" aria-label="向前">↑</button><button class="left" data-dir="left" aria-label="向左">←</button><button class="down" data-dir="down" aria-label="向后">↓</button><button class="right" data-dir="right" aria-label="向右">→</button></div><button class="secondary tiny" id="jumpBtn" title="仅快速到达，不跳过阅读任务">快速到达</button><button class="primary" id="interactBtn">✦ 互动 (E)</button></div></div>
 <div id="toast"></div><div id="scene-fade"></div><div id="overlay"><div id="modal" class="modal" role="dialog" aria-modal="true" aria-live="polite"></div></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false});
const app=$('app'),overlay=$('overlay'),modal=$('modal'),markers=$('hotspots');
const STAGE=[{name:'第一幕 · 校园回忆',title:'找出两处言行，看看老师怎样推论',sub:'靠近脚踏车和纱布线索，完成I Do，再到绿色出口进入下一幕。'},{name:'第二幕 · 丽华家门口',title:'走近门铃与手表，寻找丽华体谅朋友的证据',sub:'按线索依次闯关：理解心情 → 珍惜友谊 → 丽华回应 → 整合前后证据。'},{name:'第三幕 · 新故事挑战',title:'把阅读方法用在新故事',sub:'这次走近的是小杰的故事；你扮演旁观的阅读侦探，而不是小杰。完成任务后获得徽章。'}];
const ITEMS=[
[{id:'accident',x:-3,z:-1.7,label:'脚踏车事件',next:'bandage'},{id:'bandage',x:2.1,z:-3.0,label:'第二天的纱布',next:'exit'},{id:'exit',x:4.4,z:-.6,label:'进入下一幕'}],
[{id:'bell',x:1.7,z:-3,label:'门铃：为什么犹豫',next:'watch'},{id:'watch',x:-3.5,z:-.9,label:'手表：珍惜友谊',next:'door'},{id:'door',x:0,z:-4.4,label:'丽华的真实回应',next:'evidence'},{id:'evidence',x:-3.0,z:1.5,label:'证据整合站',next:'classExit'},{id:'classExit',x:4.6,z:-1.5,label:'线下讨论站'}],
[{id:'display',x:-3.3,z:-2,label:'展示板',next:'repair'},{id:'repair',x:2.5,z:-1.6,label:'修补处',next:'finish'},{id:'finish',x:.4,z:-4.2,label:'独立挑战'}]];
const SAVE='watch_reading_walk_v5_original_only';let saved={};try{saved=JSON.parse(localStorage.getItem(SAVE)||'{}')}catch(e){}
const state={scene:0,player:{x:-4.4,z:4.1},done:{},homeAnswer:'',homeDraft:'',homeReflect:'',bridgeAnswer:'',badge:false,highest:0,helpOpen:false,muted:true,activeModal:true,...saved};
state.done=state.done||{};state.player=state.player||{x:-4.4,z:4.1};const keydown=new Set(), touchDirections=new Set();let W=1,H=1,dpr=1,lastT=performance.now(),clock=0,currentMarkers=[],toastTimer=null,shownScene=-1,ambient=null;
const starts=[{x:-4.4,z:4.1},{x:-4.4,z:4.1},{x:-4.1,z:4.1}];
function persist(){try{localStorage.setItem(SAVE,JSON.stringify({scene:state.scene,player:state.player,done:state.done,homeAnswer:state.homeAnswer,homeDraft:state.homeDraft,homeReflect:state.homeReflect,bridgeAnswer:state.bridgeAnswer,badge:state.badge,highest:state.highest}))}catch(e){}}
function isDone(id){return !!state.done[id]}
function mark(id){state.done[id]=true;persist();renderUI();}
function stageItems(){return ITEMS[state.scene]}
function isLocked(id){if(state.scene===0)return id==='bandage'&&!isDone('accident')||id==='exit'&&!isDone('bandage');if(state.scene===1)return id==='watch'&&!isDone('bell')||id==='door'&&!isDone('watch')||id==='evidence'&&!isDone('door')||id==='classExit'&&!isDone('evidence');return id==='repair'&&!isDone('display')||id==='finish'&&!isDone('repair');}
function nextTarget(){return stageItems().find(x=>!isDone(x.id))||stageItems().at(-1)}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){overlay.classList.remove('hidden');state.activeModal=true;modal.innerHTML=html;const focus=modal.querySelector('button');if(focus)focus.focus();}
function close(){overlay.classList.add('hidden');state.activeModal=false;modal.innerHTML='';}
function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
function renderUI(){const st=STAGE[state.scene];$('chapterLabel').textContent=st.name;$('objectiveTitle').textContent=st.title;$('objectiveSub').textContent=st.sub;let target=nextTarget();$('statusTitle').textContent=target&&isDone(target.id)?'🏅 本幕已完成':'✨ 下一个线索：'+(target?.label||'任务');$('statusInfo').textContent='用方向键 / WASD 移动 · 靠近后按 E 或点击任务标记';const items=stageItems();document.querySelectorAll('#keys .key').forEach((el,i)=>el.classList.toggle('on',i<items.filter(it=>isDone(it.id)).length));}
function sceneStart(scene){state.scene=scene;state.highest=Math.max(state.highest,scene);state.player={...starts[scene]};state.insideHotspotId=null;state.autowalk=null;persist();renderUI();renderMarkers();$('scene-fade').classList.add('on');setTimeout(()=>$('scene-fade').classList.remove('on'),360);toast(['📖 第一幕：友谊的回忆','🚪 第二幕：丽华家门口','📚 第三幕：新故事挑战'][scene]);}
function optionsHTML(opts,multi=false){return '<div class="choices" id="answers">'+opts.map((o,i)=>`<button type="button" class="choice" data-choice="${i}"><span class="mark">${multi?'□':String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')+'</div>'}
function choicesSetup(correct,ok, wrongText,multi=false){let selected=new Set();document.querySelectorAll('#answers .choice').forEach(b=>b.addEventListener('click',()=>{let i=Number(b.dataset.choice);if(!multi)selected.clear();if(multi&&selected.has(i))selected.delete(i);else selected.add(i);document.querySelectorAll('#answers .choice').forEach(c=>{let on=selected.has(Number(c.dataset.choice));c.classList.toggle('selected',on);c.querySelector('.mark').textContent=multi?(on?'☑':'□'):String.fromCharCode(65+Number(c.dataset.choice))})}));$('checkBtn').addEventListener('click',()=>{let pass=selected.size===correct.length&&correct.every(x=>selected.has(x));if(pass){$('feedback').className='feedback ok';$('feedback').innerHTML='✓ 阅读证据正确！关卡已解锁。';$('checkBtn').disabled=true;mark(ok.id);const done=$('continueBtn');if(done){done.style.display='inline-block';done.addEventListener('click',()=>{close();if(ok.after)ok.after()})}toast('✨ 线索解锁！');}else{$('feedback').className='feedback';$('feedback').textContent=wrongText;toast('再找一找原文线索');}});}
function quizModal({label,heading,quote,options,correct,multi=false,hint,why,id,onSuccess}){
show(`<div class="eyebrow">✧ 闯关任务 · ${esc(label)}</div><h2>${esc(heading)}</h2>${quote?`<div class="quote">${esc(quote)}</div>`:''}${optionsHTML(options,multi)}<details class="support"><summary>🧩 需要提示？点击查看</summary><p>${esc(hint)}</p></details><div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回场景</button><button class="primary" id="checkBtn">核对我的选择</button><button class="primary" id="continueBtn" style="display:none">继续探索 →</button></div>`);
$('backBtn').onclick=close;choicesSetup(correct,{id,after:()=>{if(onSuccess)onSuccess()}},why,multi)
}
function teacherMemory1(){show(`<div class="eyebrow">I DO · 教师示范 1/2</div><h2>第一处证据：危险时刻</h2><p>场景提示：丽华看见脚踏车冲向“我”，连忙把“我”推开。<strong>丽华自己摔倒受伤，“我”没有受伤。</strong></p><div class="quote">第3段：“丽华连忙推开我，结果自己却摔倒在地上。她擦伤了手臂，我反而没事。”</div><p><strong>教师 Think-Aloud：</strong>“我先想到：丽华可能很关心别人。不过，我要检查自己的判断，还有没有另一处言行可以支持？”</p><div class="note">请学生留意：老师没有只说“她很好”，而是先找动作证据，再继续验证。</div><div class="modal-actions"><button class="secondary" id="closeBtn">返回场景</button><button class="primary" id="collectBtn">收下证据一 ✓</button></div>`);$('closeBtn').onclick=close;$('collectBtn').onclick=()=>{mark('accident');close();toast('已收集第3段行动证据');};}
function teacherMemory2(){show(`<div class="eyebrow">I DO · 教师示范 2/2</div><h2>第二处证据：受伤后的关心</h2><div class="quote">第4段：“丽华手臂缠着纱布走进教室。……她却关心地问我：‘你没事吧？’”</div><p><strong>教师 Think-Aloud：</strong>“丽华自己受伤，仍然先关心‘我’。联系第3段保护朋友的动作，我更有依据推论：她善良、关心他人。”</p><div class="checklist"><strong>老师自我检查：</strong><div>① 我找到课文里的两处言行了吗？</div><div>② 为什么这两处证据说明她关心别人？</div><div>③ 我有没有把游戏补充的画面当成原文事实？</div></div><div class="modal-actions"><button class="secondary" id="closeBtn">返回</button><button class="primary" id="collectBtn">收下证据二 ✓</button></div>`);$('closeBtn').onclick=close;$('collectBtn').onclick=()=>{mark('bandage');close();toast('两处证据已整理');};}
function campusGate(){quizModal({label:'第一幕出口',heading:'结合第3、4段，哪些是课文中表现丽华关心他人的证据？（选两项）',options:['丽华推开“我”，自己却摔倒受伤。','丽华要求“我”把手表换回来。','丽华受伤后仍先问“我”有没有事。','丽华因为手表的事情责怪“我”。'],correct:[0,2],multi:true,hint:'回忆老师刚才点击的“脚踏车”和“纱布”两个任务点。',why:'再核对第3、4段。这关要选两处真正来自原文、支持人物特点的言行。',id:'exit',onSuccess:()=>sceneStart(1)});}
function watchQuest(){quizModal({label:'心意线索 · 第5段',heading:'“我”为什么选叔叔送的名贵手表作为送别礼物？',quote:'第5段：“丽华说她要随父母移居海外，我非常难过。我想送她一份珍贵的礼物……最后选择了叔叔给我的那只手表。”',options:['为了向丽华炫耀自己有一只名贵的手表。','为了表达对这段友谊的珍惜。','因为丽华要求“我”送她名贵手表。'],correct:[1],hint:'回想两人相识及丽华曾帮助“我”的经过，再阅读第5段。',why:'第5段写出“我”因为丽华将离开而非常难过，想用一份珍贵的礼物表达心意。',id:'watch'});}
function bellQuest(){quizModal({label:'门铃任务 · 第7段',heading:'“我”为什么几次伸手又缩回来？',quote:'“我心想：她会生气吗？我会不会失去这个朋友？”',options:['“我”找不到门铃在哪里。','“我”担心丽华生气，害怕失去朋友。','“我”不记得丽华家的地址。'],correct:[1],hint:'第7段直接写了“我”的内心想法，试着从心理描写寻找依据。',why:'注意人物心理：“她会生气吗？我会不会失去这个朋友？”',id:'bell'});}

function evidenceStation(){show(`<div class="eyebrow">WE DO · 证据整合站 · 第3–4、8段</div><h2>同一人物，前后的言行有什么联系？</h2><p>现在不是复述故事，而是把<strong>不同时候的相关证据</strong>联系起来，说明人物特点。</p><div class="quote"><strong>前面的言行：</strong>第3段丽华推开“我”，自己摔倒受伤；第4段她受伤后仍先关心“我”。<br/><strong>后来的言行：</strong>第8段丽华归还手表，拍拍“我”的肩膀，并安慰“我”。</div><p><strong>闯关题：</strong>哪一项最合理地连接了这些言行与丽华的特点？</p>${optionsHTML(['丽华前后都考虑朋友的感受：先保护、关心“我”，后来理解并安慰“我”，体现她善良、体贴。','丽华最关心手表的价钱，因此愿意和“我”做朋友。','丽华因为害怕妈妈，所以把手表还给“我”。'])}<details class="support"><summary>🧩 需要帮助？</summary><p>找依据：她分别做了什么？　作推论：这些表现有什么共同点？　联主题：朋友之间除了互相帮助，还需要什么？</p><p>词汇：体谅（tǐ liàng, be considerate）；珍惜（zhēn xī, cherish）。</p></details><div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="backBtn">返回场景</button><button class="primary" id="checkBtn">检查我的推论</button><button class="primary" id="continueBtn" style="display:none">写出自己的解释 →</button></div>`);$('backBtn').onclick=close;choicesSetup([0],{id:'evidenceChoice',after:evidenceWrite},'请检查：你的推论是否同时符合第3–4段与第8段的事实？');}
function evidenceWrite(){show(`<div class="eyebrow">WE DO · 解释记录（不自动评分）</div><h2>用自己的话说明理由</h2><p>请用一到两句话写出：丽华前后的哪些言行体现她关心、体谅朋友？为什么？</p><textarea id="bridgeWrite" class="text-entry" placeholder="从丽华……和……可以看出她……，因为……">${esc(state.bridgeAnswer||'')}</textarea><div class="note">游戏只记录这次解释，不根据字数或关键词判断阅读质量。教师会在线下讨论及课堂文字作答中帮助大家完善。</div><details class="support"><summary>句式支架 / English</summary><p>从第____段的____和第____段的____，可以看出丽华____，因为____。</p><p>体谅 — to be understanding; 关心 — care for others; 推论 — inference.</p></details><div class="modal-actions"><button class="secondary" id="backBtn">再看证据</button><button class="primary" id="saveBtn">保存我的解释并解锁讨论站 →</button></div>`);$('backBtn').onclick=evidenceStation;$('bridgeWrite').addEventListener('input',ev=>{state.bridgeAnswer=ev.target.value;persist()});$('saveBtn').onclick=()=>{const t=$('bridgeWrite').value.trim();if(t.length<8){toast('试着写出一项人物言行及你的解释');return}state.bridgeAnswer=t;mark('evidence');close();toast('已记录解释；请在课堂讨论中核对');};}
function classroomCheckpoint(){mark('classExit');show(`<div class="eyebrow">✓ 第二幕完成 · 线下教学暂停点</div><h2>暂停游戏，回到《手表》原文</h2><div class="checklist"><strong>师生讨论（对应成功标准）</strong><p>① 第3–4段与第8段中，丽华怎样关心、体谅“我”？请用两处原文依据说明。（SC1）</p><p>② 为什么“我”在第9段流泪？这些情节让你明白朋友之间应该怎样相处？（SC2）</p><p>③ 如果你收到不喜欢但朋友用心准备的礼物，你会怎样回应？为什么？（SC3）</p></div><div class="note"><strong>我的游戏初步解释：</strong><br/>${esc(state.bridgeAnswer||'尚未填写')}</div><p>接下来在学校允许的平台上完成：<strong>独立文字初稿 → 根据成功标准自评 → 修改并写一句反思</strong>。</p><div class="modal-actions"><button class="secondary" id="backBtn">返回门口回看</button><button class="secondary" id="copyBtn">复制游戏中的解释</button><button class="primary" id="nextBtn">课堂结束后，开启课后新故事 →</button></div>`);$('backBtn').onclick=close;$('copyBtn').onclick=()=>{const t=state.bridgeAnswer||'';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制初步解释')).catch(()=>toast('复制未成功，请手动选择文字'))}else toast('可手动选择上方文字复制')};$('nextBtn').onclick=()=>{close();sceneStart(2)};}

}else{slab(0,-.3,16,14,'#f7e8bd');box(0,0,-7.1,16,5,1,'#fff8e6');box(0,1.5,-6.5,7,2.5,.16,'#97bda5');box(0,1.65,-6.35,6.3,1.85,.12,'#dfebd2');for(let i=0;i<5;i++)box(-2.35+i*1.2,1.93,-6.21,.72,.6,.06,i%2?'#b7d8e7':'#f4d293');box(-3,.08,-2,2.3,.65,1.25,'#e8caa5');box(2.5,.08,-2,2.3,.65,1.25,'#e8caa5');box(0,.08,-3,2.1,.62,1.1,'#dfbc96');box(-5.25,1.6,-6.55,1.35,1.3,.08,'#a6d9e1');box(5,1.6,-6.5,1.3,1.3,.08,'#a6d9e1');potted(5,-5);sprites.push({kind:'xiaojie',x:1.4,z:-4.1,scale:.98});signpost(.4,-4.2,'挑战','#f5d780');}
}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9ad3f6');g.addColorStop(.48,'#e2f4ff');g.addColorStop(.63,'#faf6d9');g.addColorStop(1,'#e8e8c1');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const cloud=(x,y,w)=>{ctx.fillStyle='#ffffff9b';ctx.beginPath();ctx.ellipse(x,y,w,.27*w,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x-.25*w,y-.07*w,.35*w,.31*w,0,0,Math.PI*2);ctx.ellipse(x+.18*w,y-.11*w,.33*w,.36*w,0,0,Math.PI*2);ctx.fill()};cloud(W*.18,H*.18,W*.105);cloud(W*.78,H*.11,W*.15);cloud(W*.52,H*.27,W*.07);ctx.fillStyle='#8ab2b65d';ctx.beginPath();ctx.moveTo(0,H*.63);for(let i=0;i<=W;i+=70)ctx.lineTo(i,H*.56+Math.sin(i*.008+clock*.07)*22);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function painterFaces(){let render=[];for(let f of faces){let points=f.points.map(project);if(points.some(p=>!p))continue;const avg=points.reduce((a,p)=>a+p.d,0)/points.length;render.push({points,avg,color:f.color,stroke:f.stroke})}render.sort((a,b)=>b.avg-a.avg);for(let f of render){let p=f.points;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=f.color;ctx.fill();ctx.lineWidth=.45;ctx.strokeStyle='#6b806318';ctx.stroke();}}
function drawPerson(x,z,kind,scale=1,fallen=false,moving=false){let foot=project([x,0,z]),head=project([x,2.25*scale,z]);if(!foot||!head)return;let sz=clamp(foot.y-head.y,42,240),mid=(foot.x+head.x)/2,cy=foot.y;let h=sz,w=sz*.55,bob=moving?Math.sin(clock*11)*3:0;
ctx.fillStyle='#34554826';ctx.beginPath();ctx.ellipse(foot.x,foot.y,Math.max(7,foot.s*.45),Math.max(3,foot.s*.11),0,0,Math.PI*2);ctx.fill();
ctx.save();ctx.translate(mid,cy+bob);if(fallen){ctx.rotate(.48);ctx.translate(0,7)}
let k=kind==='lihua'?'#3a2927':kind==='xiaojie'?'#59443c':'#2d3033';let skirt=kind==='xiaojie'?'#758da4':'#476b98';let skin='#f9d0a9';
// legs
ctx.fillStyle='#f0c9a7';ctx.fillRect(-w*.21,-h*.26,w*.13,h*.24);ctx.fillRect(w*.07,-h*.26,w*.13,h*.24);ctx.fillStyle='#fffefa';ctx.fillRect(-w*.22,-h*.09,w*.16,h*.12);ctx.fillRect(w*.06,-h*.09,w*.16,h*.12);
// shoes
ctx.fillStyle='#e8e9df';ctx.beginPath();ctx.ellipse(-w*.12,-h*.015,w*.16,h*.045,0,0,Math.PI*2);ctx.ellipse(w*.16,-h*.015,w*.16,h*.045,0,0,Math.PI*2);ctx.fill();
// dress
ctx.fillStyle=skirt;ctx.beginPath();ctx.moveTo(-w*.21,-h*.38);ctx.lineTo(w*.21,-h*.38);ctx.lineTo(w*.32,-h*.23);ctx.lineTo(-w*.32,-h*.23);ctx.fill();ctx.fillStyle='#fffef3';ctx.fillRect(-w*.22,-h*.52,w*.44,h*.17);ctx.fillStyle='#f6cead';ctx.fillRect(-w*.3,-h*.51,w*.085,h*.16);ctx.fillRect(w*.215,-h*.51,w*.085,h*.16);
// hair back & face
ctx.fillStyle=k;ctx.beginPath();ctx.ellipse(0,-h*.725,w*.33,h*.23,0,0,Math.PI*2);ctx.fill();if(kind==='lihua'){ctx.beginPath();ctx.ellipse(w*.32,-h*.82,w*.13,h*.17,.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8ebfe6';ctx.beginPath();ctx.arc(w*.25,-h*.79,w*.09,0,Math.PI*2);ctx.fill()}
ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-h*.695,w*.305,h*.198,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=k;ctx.beginPath();ctx.ellipse(0,-h*.827,w*.31,h*.095,0,Math.PI,Math.PI*2);ctx.fill();
// narrator hat
if(kind==='narrator'){ctx.fillStyle='#fff8ea';ctx.beginPath();ctx.ellipse(0,-h*.861,w*.36,h*.073,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(0,-h*.92,w*.245,h*.11,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#678c8e';ctx.fillRect(-w*.17,-h*.859,w*.34,h*.018)}
// eyes
ctx.fillStyle='#3d3934';for(let xx of [-w*.12,w*.12]){ctx.beginPath();ctx.ellipse(xx,-h*.7,w*.026,h*.034,0,0,Math.PI*2);ctx.fill()}
ctx.strokeStyle='#aa7770';ctx.lineWidth=Math.max(1,sz*.01);ctx.beginPath();ctx.arc(0,-h*.63,w*.055,.03,Math.PI-.03);ctx.stroke();
ctx.restore();}
function drawGlows(){for(let it of stageItems()){let p=project([it.x,.08,it.z]);if(!p)continue;let r=clamp(p.s*.58,10,45);ctx.save();ctx.strokeStyle=isDone(it.id)?'#7cc59488':isLocked(it.id)?'#afbcb48c':'#ffe59c';ctx.lineWidth=3;ctx.setLineDash([4,5]);ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.37,0,0,Math.PI*2);ctx.stroke();ctx.restore();}}
function drawWorld(){drawSky();updateCamera();worldBuild();painterFaces();let ordered=sprites.map(s=>({...s,p:project([s.x,0,s.z])})).filter(x=>x.p).sort((a,b)=>b.p.d-a.p.d);for(let s of ordered)drawPerson(s.x,s.z,s.kind,s.scale,s.fallen);drawPerson(state.player.x,state.player.z,state.scene===2?'narrator':'narrator',1.05,false,Math.abs(lastMove)>0);drawGlows();}
let lastMove=0;
function renderMarkers(){markers.innerHTML='';for(let it of stageItems()){let b=document.createElement('button');b.className='hotspot';b.dataset.id=it.id;b.type='button';b.textContent=it.label;b.addEventListener('click',()=>{const d=Math.hypot(state.player.x-it.x,state.player.z-it.z);if(d<2.3)interact(it);else{toast('先走近任务点（可按方向键）');state.autowalk={x:it.x,z:it.z,id:it.id};}});markers.append(b);}}
function updateMarkers(){for(let it of stageItems()){let el=markers.querySelector(`[data-id="${it.id}"]`);if(!el)continue;let p=project([it.x,1.25,it.z]);let d=Math.hypot(state.player.x-it.x,state.player.z-it.z);if(p){el.style.display='block';el.style.left=p.x+'px';el.style.top=p.y+'px';el.classList.toggle('near',d<2.3);el.classList.toggle('locked',isLocked(it.id));el.classList.toggle('done',isDone(it.id));el.textContent=(isDone(it.id)?'✓ ':isLocked(it.id)?'🔒 ':'✦ ')+it.label;}else el.style.display='none';}}
function move(dt){if(state.activeModal)return;let x=0,z=0;if(keydown.has('w')||keydown.has('arrowup')||touchDirections.has('up'))z--;if(keydown.has('s')||keydown.has('arrowdown')||touchDirections.has('down'))z++;if(keydown.has('a')||keydown.has('arrowleft')||touchDirections.has('left'))x--;if(keydown.has('d')||keydown.has('arrowright')||touchDirections.has('right'))x++;if(!x&&!z&&state.autowalk){let dx=state.autowalk.x-state.player.x,dz=state.autowalk.z-state.player.z,d=Math.hypot(dx,dz);if(d>1.5){x=dx/d;z=dz/d}else{let target=stageItems().find(t=>t.id===state.autowalk.id);state.autowalk=null;if(target)interact(target);}}if(x||z){let inv=1/(Math.hypot(x,z)||1),step=dt*3.15;state.player.x=clamp(state.player.x+x*inv*step,-6.25,6.25);state.player.z=clamp(state.player.z+z*inv*step,-5.2,5.35);lastMove=1;}else lastMove=0;let n=nearest();if(n&&n.dist>1.32)state.insideHotspotId=null;if(n&&n.dist<.79&&!isLocked(n.id)&&!isDone(n.id)&&state.insideHotspotId!==n.id){state.insideHotspotId=n.id;interact(n)}}
function resize(){const r=app.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function animate(t){let dt=Math.min(.05,(t-lastT)/1000);lastT=t;clock+=dt;move(dt);drawWorld();updateMarkers();requestAnimationFrame(animate)}
renderUI();renderMarkers();welcome();requestAnimationFrame(animate);
})();
</script>
