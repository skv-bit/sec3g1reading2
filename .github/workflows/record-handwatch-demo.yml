name: Record real Handwatch 3D gameplay with Chinese narration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/record-handwatch-demo.yml'
      - 'scripts/record_handwatch_demo.py'

permissions:
  contents: write

jobs:
  record-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout genuine game code and artwork
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install recording and Chinese subtitles tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk espeak-ng
          python -m pip install --upgrade pip
          python -m pip install playwright edge-tts pydub numpy pillow reportlab
          python -m playwright install --with-deps chromium

      - name: Start local game and record actual UI interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/handwatch_game_server.log 2>&1 &
          sleep 2
          python scripts/record_handwatch_demo.py

      - name: Build curated teaching-flow PDF from the latest recording
        if: success()
        run: |
          python scripts/build_teaching_flow_pdf.py

      - name: Upload video and evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handwatch-screen-recording-v2
          path: |
            recorded_demo/*.mp4
            recorded_demo/*.webm
            recorded_demo/*.srt
            recorded_demo/*.json
            recorded_demo/*.pdf
            recorded_demo/*failed*.png
            recorded_demo/failure.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the new teaching-flow PDF as a public release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="handwatch-teaching-flow-${GITHUB_SHA:0:8}"
          gh release create "$tag" \
            "recorded_demo/手表_最新版_教学流程精选.pdf" \
            --title "《手表》最新游戏教学流程精选 PDF (${GITHUB_SHA:0:8})" \
            --notes "由最新游戏源码真实浏览器自动录制并整理的教学流程精选版。涵盖登入、辅助功能（每项只示范一次）、两关任务、证据集合站、差异化侦探笔记、提交与自评。" \
            --target "$GITHUB_SHA" \
            --latest=false
